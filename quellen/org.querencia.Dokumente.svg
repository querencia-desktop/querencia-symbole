<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="64" height="64" viewBox="0 0 64 64" role="img" aria-labelledby="title description">
  <title id="title">Querencia Dokumente</title>
  <desc id="description">Blatt mit Eselsohr, Überschrift in Querencia-Orange (#F07746) und grauen Textzeilen, davor eine Lupe mit orangem Griff, flächig (Symbole 0.6; Entwurf Dokumente 0.1.0 unter entwurf/).</desc>
  <!-- Blatt, oben rechts geknickt -->
  <path d="M10 4 H36 L50 18 V56 A4 4 0 0 1 46 60 H10 A4 4 0 0 1 6 56 V8 A4 4 0 0 1 10 4 Z" fill="#f4f3f1" stroke="#5a5a5a" stroke-width="4" stroke-linejoin="round"/>
  <!-- Eselsohr -->
  <path d="M36 4 V15 A3 3 0 0 0 39 18 H50 Z" fill="#c9c6c2" stroke="#5a5a5a" stroke-width="4" stroke-linejoin="round"/>
  <!-- Überschrift -->
  <rect x="12" y="11" width="18" height="7" rx="2" fill="#F07746"/>
  <!-- Textzeilen, unten kürzer für die Lupe -->
  <rect x="12" y="25" width="31" height="4" rx="2" fill="#9a9a9a"/>
  <rect x="12" y="33" width="22" height="4" rx="2" fill="#9a9a9a"/>
  <rect x="12" y="41" width="16" height="4" rx="2" fill="#9a9a9a"/>
  <rect x="12" y="49" width="14" height="4" rx="2" fill="#9a9a9a"/>
  <!-- Lupe: Griff, dann Glas -->
  <g transform="translate(43 43)">
    <path d="M7 7 L17 17" stroke="#5a5a5a" stroke-width="8" stroke-linecap="round"/>
    <path d="M7.5 7.5 L16 16" stroke="#F07746" stroke-width="4" stroke-linecap="round"/>
    <circle cx="0" cy="0" r="11" fill="#ffffff" stroke="#5a5a5a" stroke-width="4"/>
    <circle cx="0" cy="0" r="11" fill="#9a9a9a" fill-opacity="0.18"/>
  </g>
</svg>
